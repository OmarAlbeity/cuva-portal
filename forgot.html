<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Reset Password · CUVA Portal</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tailwind.css?v=3.2.0">
  <link rel="stylesheet" href="css/styles.css?v=3.2.0">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <div id="app-header"></div>

  <main class="flex-grow w-full max-w-md mx-auto px-4 py-6 sm:py-12">
    <section class="bg-white rounded-3xl p-5 sm:p-8 shadow-sm sm:shadow-xl border border-slate-200 space-y-5">

      <div>
        <div class="w-10 h-10 rounded-2xl bg-brand-50 text-brand-600 flex items-center justify-center mb-2">
          <i data-lucide="key-round" class="w-5 h-5"></i>
        </div>
        <h2 class="text-xl font-black text-slate-900">Reset Your Password</h2>
        <p id="reset-intro" class="text-sm sm:text-xs text-slate-500">Enter the email address you registered with. We'll send you a 6-digit code.</p>
      </div>

      <!-- Step 1: email -->
      <form id="form-forgot" onsubmit="Page.sendCode(event)" class="space-y-4 text-xs">
        <div>
          <label for="fp-email" class="block font-bold text-slate-700 mb-1">Email Address</label>
          <input type="email" id="fp-email" autocomplete="email" autocapitalize="none" spellcheck="false" required maxlength="254" placeholder="The email you registered with"
            class="w-full px-3.5 py-3 sm:py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50">
        </div>
        <button type="submit" id="fp-send" class="w-full py-3.5 sm:py-3 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl transition text-sm shadow-md">
          Send Code
        </button>
      </form>

      <!-- Step 2: code + new password -->
      <form id="form-reset" onsubmit="Page.resetPassword(event)" class="hidden space-y-4 text-xs">
        <div class="p-3 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs">
          <p id="fp-sent-msg" class="font-bold"></p>
          <p class="mt-1">Sent to <span id="fp-sent-to" class="font-mono font-bold break-all"></span>
            · <button type="button" onclick="Page.changeEmail()" class="underline font-bold">change</button></p>
        </div>

        <div>
          <label for="fp-code" class="block font-bold text-slate-700 mb-1">6-digit code</label>
          <input type="text" id="fp-code" inputmode="numeric" autocomplete="one-time-code" pattern="\d{6}" maxlength="6" required placeholder="••••••"
            class="w-full px-3.5 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50 font-mono text-center text-2xl tracking-[0.5em]">
        </div>

        <div>
          <label for="fp-password" class="block font-bold text-slate-700 mb-1">New password (min 8 characters)</label>
          <input type="password" id="fp-password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="At least 8 characters"
            class="w-full px-3.5 py-3 sm:py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50">
        </div>

        <div>
          <label for="fp-password2" class="block font-bold text-slate-700 mb-1">Confirm new password</label>
          <input type="password" id="fp-password2" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="Type it again"
            class="w-full px-3.5 py-3 sm:py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50">
        </div>

        <button type="submit" id="fp-reset" class="w-full py-3.5 sm:py-3 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl transition text-sm shadow-md">
          Set New Password
        </button>

        <button type="button" id="fp-resend" onclick="Page.resend(this)" class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition text-sm sm:text-xs disabled:opacity-60 disabled:cursor-not-allowed">
          Resend code
        </button>
      </form>

      <p class="text-center text-slate-500 text-sm sm:text-xs">
        Remembered it? <a id="link-signin" href="signin.html" class="text-brand-600 font-bold hover:underline">Back to Sign In</a>
      </p>
      <p class="text-center text-[11px] text-slate-400">Didn't get an email? Check your spam folder. Still stuck? Contact a CUVA organizer.</p>
    </section>
  </main>

  <div id="app-footer"></div>
  <div id="app-bottom-nav"></div>

  <script src="vendor/icons.js?v=3.2.0"></script>
  <script src="js/api.js?v=3.2.0"></script>
  <script src="js/common.js?v=3.2.0"></script>
  <script src="js/pages/forgot.js?v=3.2.0"></script>
</body>
</html>
