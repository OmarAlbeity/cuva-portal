<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Discover Activities · CUVA Portal</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <div id="app-header"></div>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-5 sm:py-8 space-y-5 sm:space-y-8">

    <!-- Earliest upcoming activity -->
    <section class="relative overflow-hidden rounded-3xl cuva-gradient-bg text-white p-5 sm:p-10 shadow-xl border border-rose-900/30">
      <div class="absolute -right-16 -top-16 w-64 h-64 sm:w-80 sm:h-80 rounded-full bg-brand-600/25 blur-3xl pointer-events-none"></div>
      <div class="absolute -left-16 -bottom-16 w-64 h-64 sm:w-80 sm:h-80 rounded-full bg-cuva-blue/20 blur-3xl pointer-events-none"></div>
      <div class="absolute right-1/3 bottom-0 w-64 h-32 bg-cuva-gold/15 blur-2xl pointer-events-none"></div>

      <div id="hero-content" class="relative z-10 flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-5 sm:gap-8"></div>
    </section>

    <!-- Filters & search -->
    <section class="bg-white p-3 sm:p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col lg:flex-row lg:items-center justify-between gap-3">
      <div id="category-pills" class="no-scrollbar flex items-center gap-2 overflow-x-auto -mx-3 px-3 sm:mx-0 sm:px-0 pb-0.5"></div>

      <div class="flex items-center gap-2.5 w-full lg:w-auto">
        <div class="relative flex-grow lg:w-64">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input type="search" id="search-activity-input" oninput="Page.renderActivities()" placeholder="Search activities, location..." autocomplete="off"
            class="w-full pl-9 pr-3.5 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition">
        </div>
        <span id="activity-counter-badge" class="text-xs font-bold text-slate-400 whitespace-nowrap">0 Found</span>
      </div>
    </section>

    <!-- Activities -->
    <section>
      <div id="activities-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6"></div>
    </section>
  </main>

  <div id="app-footer"></div>
  <div id="app-bottom-nav"></div>

  <script src="vendor/icons.js"></script>
  <script src="vendor/qrcode.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages/explore.js"></script>
</body>
</html>
