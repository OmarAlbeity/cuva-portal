<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Register · CUVA Portal</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <div id="app-header"></div>

  <main class="flex-grow w-full max-w-md mx-auto px-4 py-6 sm:py-12">
    <section class="bg-white rounded-3xl p-5 sm:p-8 shadow-sm sm:shadow-xl border border-slate-200 space-y-5">

      <div>
        <div class="w-10 h-10 rounded-2xl bg-brand-50 text-brand-600 flex items-center justify-center mb-2">
          <i data-lucide="user-plus" class="w-5 h-5"></i>
        </div>
        <h2 class="text-xl font-black text-slate-900">Student Profile Sign Up</h2>
        <p class="text-sm sm:text-xs text-slate-500">Register your student info once. Enjoy 1-click registration for all CUVA activities.</p>
      </div>

      <form id="form-signup" onsubmit="Page.submit(event)" class="space-y-3.5 text-xs">
        <div>
          <label for="su-name" class="block font-bold text-slate-700 mb-1">Full Name *</label>
          <input type="text" id="su-name" autocomplete="name" required maxlength="60" placeholder="e.g. Alex Johnson or Li Wei"
            class="w-full px-3.5 py-3 sm:py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label for="su-studentid" class="block font-bold text-slate-700 mb-1">Student ID * (Unique Login)</label>
            <input type="text" inputmode="numeric" autocomplete="username" id="su-studentid" required pattern="\d{6,16}" maxlength="16" title="6–16 digits" placeholder="e.g. 2024830192"
              class="w-full px-3.5 py-3 sm:py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50 font-mono">
          </div>
          <div>
            <label for="su-wechat" class="block font-bold text-slate-700 mb-1">WeChat Handle *</label>
            <input type="text" id="su-wechat" autocapitalize="none" required maxlength="40" placeholder="e.g. wx_alex2024"
              class="w-full px-3.5 py-3 sm:py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label for="su-major" class="block font-bold text-slate-700 mb-1">Major / School *</label>
            <input type="text" id="su-major" required maxlength="80" placeholder="e.g. Software Engineering"
              class="w-full px-3.5 py-3 sm:py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50">
          </div>
          <div>
            <label for="su-grade" class="block font-bold text-slate-700 mb-1">Grade Level *</label>
            <select id="su-grade" required
              class="w-full px-3.5 py-3 sm:py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50 font-medium">
              <option value="Bachelor">Bachelor</option>
              <option value="Master">Master</option>
              <option value="PhD">PhD</option>
            </select>
          </div>
        </div>

        <div>
          <label for="su-password" class="block font-bold text-slate-700 mb-1">Password * (Min 8 Characters)</label>
          <input type="password" id="su-password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="At least 8 characters"
            class="w-full px-3.5 py-3 sm:py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50">
        </div>

        <button type="submit" id="su-submit" class="w-full py-3.5 sm:py-3 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl transition text-sm shadow-md mt-2">
          Create Account &amp; Log In
        </button>

        <p class="text-center text-slate-500 text-sm sm:text-xs">
          Already have an account?
          <a id="link-signin" href="signin.html" class="text-brand-600 font-bold hover:underline">Sign In</a>
        </p>
      </form>
    </section>
  </main>

  <div id="app-footer"></div>
  <div id="app-bottom-nav"></div>

  <script src="vendor/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages/signup.js"></script>
</body>
</html>
