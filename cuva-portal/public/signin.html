<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Sign In · CUVA Portal</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tailwind.css?v=3.1.0">
  <link rel="stylesheet" href="css/styles.css?v=3.1.0">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <div id="app-header"></div>

  <main class="flex-grow w-full max-w-md mx-auto px-4 py-6 sm:py-12">
    <section class="bg-white rounded-3xl p-5 sm:p-8 shadow-sm sm:shadow-xl border border-slate-200 space-y-5">

      <div>
        <div class="w-10 h-10 rounded-2xl bg-brand-50 text-brand-600 flex items-center justify-center mb-2">
          <i data-lucide="log-in" class="w-5 h-5"></i>
        </div>
        <h2 class="text-xl font-black text-slate-900">Student Sign In</h2>
        <p class="text-sm sm:text-xs text-slate-500">Log in with your Student ID and Password.</p>
      </div>

      <!-- Shown when someone is already signed in -->
      <div id="current-session-note" class="hidden p-3 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-600"></div>

      <form id="form-signin" onsubmit="Page.submit(event)" class="space-y-4 text-xs">
        <div>
          <label for="si-studentid" class="block font-bold text-slate-700 mb-1">Student ID</label>
          <input type="text" inputmode="numeric" autocomplete="username" id="si-studentid" required maxlength="16" placeholder="e.g. 2024830192"
            class="w-full px-3.5 py-3 sm:py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50 font-mono">
        </div>

        <div>
          <label for="si-password" class="block font-bold text-slate-700 mb-1">Password</label>
          <input type="password" autocomplete="current-password" id="si-password" required placeholder="Your password"
            class="w-full px-3.5 py-3 sm:py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50">
        </div>

        <button type="submit" id="si-submit" class="w-full py-3.5 sm:py-3 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl transition text-sm shadow-md">
          Sign In
        </button>

        <p class="text-center text-slate-500 text-sm sm:text-xs">
          First time here?
          <a id="link-signup" href="signup.html" class="text-brand-600 font-bold hover:underline">Register Once</a>
        </p>
      </form>
    </section>
  </main>

  <div id="app-footer"></div>
  <div id="app-bottom-nav"></div>

  <script src="vendor/icons.js?v=3.1.0"></script>
  <script src="js/api.js?v=3.1.0"></script>
  <script src="js/common.js?v=3.1.0"></script>
  <script src="js/pages/signin.js?v=3.1.0"></script>
</body>
</html>
